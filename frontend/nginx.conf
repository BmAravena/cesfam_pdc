server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Resolver interno de Docker: permite reencontrar el backend si el
    # contenedor se recrea y cambia de IP. Sin esto, Nginx podría quedar
    # apuntando a una IP antigua hasta reiniciarse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8000;

    # La API conserva el prefijo /api/v1 al llegar a FastAPI.
    location /api/ {
        proxy_pass $backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx es el borde: no reenviamos un X-Forwarded-For enviado por el
        # cliente, para que no se pueda falsificar la IP de auditoría.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Assets con hash generados por Vite.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # El index debe revalidarse para que un despliegue nuevo no quede
    # atrapado en la caché del navegador.
    location = /index.html {
        expires -1;
    }

    # React Router usa History API: cualquier ruta desconocida debe
    # devolver el index y no un 404 de Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
